<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>netbox-iec62443</title>
  <!-- Two zones joined by a conduit with a checkpoint. CC BY 4.0, Packetflow. -->
  <rect width="512" height="512" rx="112" fill="#1A1815"/>
  <!-- conduit -->
  <rect x="236" y="150" width="40" height="210" fill="#F5F1EA"/>
  <!-- upper zone (enterprise / supplier side) -->
  <rect x="104" y="72" width="304" height="92" rx="28" fill="#1A1815" stroke="#F5F1EA" stroke-width="26"/>
  <!-- lower zone (controllers) -->
  <rect x="88" y="344" width="336" height="108" rx="32" fill="#E2620F"/>
  <!-- checkpoint on the conduit -->
  <circle cx="256" cy="254" r="38" fill="#1A1815" stroke="#E2620F" stroke-width="18"/>
  <path d="M239 255 l12 12 l23 -26" fill="none" stroke="#F5F1EA" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

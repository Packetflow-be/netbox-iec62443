{% extends 'generic/object.html' %}
{% load i18n %}

{% block content %}
  <div class="mb-3">
    <div class="btn-group btn-group-sm" role="group" aria-label="{% trans 'Purdue level' %}">
      {% for value, label in levels %}
        <a href="?max_level={{ value }}" class="btn {% if value == max_level %}btn-primary{% else %}btn-outline-secondary{% endif %}"
           title="{{ label }}">&le; {{ value }}</a>
      {% endfor %}
    </div>
    <span class="text-muted small ms-2">{% trans "Show paths into zones at or below this Purdue level." %}</span>
  </div>
  {% include 'netbox_ot/inc/accessmap_table.html' %}
{% endblock %}

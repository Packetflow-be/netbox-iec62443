[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-ot"
dynamic = ["version"]
description = "IEC 62443 zones, conduits and flows, Purdue levels, an access map and a zone register for NetBox"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Packetflow" }]
requires-python = ">=3.12"
keywords = ["netbox", "netbox-plugin", "iec62443", "ot", "ics", "scada", "purdue", "zeek", "icsnpp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/Packetflow-be/netbox-ot"
Documentation = "https://github.com/Packetflow-be/netbox-ot/blob/main/docs/README.md"
Discussions = "https://github.com/Packetflow-be/netbox-ot/discussions"
Issues = "https://github.com/Packetflow-be/netbox-ot/issues"
Changelog = "https://github.com/Packetflow-be/netbox-ot/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "netbox_ot.__version__" }

[tool.setuptools.packages.find]
include = ["netbox_ot*"]

[tool.setuptools.package-data]
netbox_ot = ["templates/**/*.html", "tests/*.json"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"netbox_ot/migrations/*" = ["E501", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["netbox_ot"]
section-order = ["future", "standard-library", "third-party", "netbox", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
netbox = ["core", "dcim", "extras", "ipam", "netbox", "tenancy", "users", "utilities", "virtualization", "vpn"]
